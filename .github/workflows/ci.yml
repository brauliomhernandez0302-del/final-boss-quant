name: CI

# Sin secretos a propósito: la suite corre sin bases de datos y sin claves de
# API. Lo que necesita un estado que sólo existe tras un backtest completo se
# marca `skipped`, no falla. Verificado en un clon limpio el 2026-08-02:
# 857 passed, 25 skipped, 0 fallos.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python 3.12 · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

  frontend:
    name: Node 22 · build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
